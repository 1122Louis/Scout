[project]
name = "scout"
version = "0.1.0"
description = "Scout: an adaptive retrieval agent (agentic RAG) that decides how much retrieval each query needs — and where to look (your own documents or the open web) — running a retrieve-judge-summarize-refine loop only when grounding is required. Fully local: Ollama + DuckDB (HNSW) + marimo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "duckdb>=1.5.3",
    "huggingface-hub>=1.19.0",
    "marimo>=0.23.9",
    "ollama>=0.6.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
